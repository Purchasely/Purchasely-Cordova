name: E2E Android

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - feat/sdk-v6-migration

concurrency:
  group: e2e-android
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Android
    # macOS 14 (Apple Silicon M1): ARM64 emulator runs natively, no KVM needed.
    # Also compatible with iOS E2E (Xcode simulator) when we add that job.
    runs-on: macos-14
    timeout-minutes: 30

    env:
      AVD_NAME: "cordova_e2e_api34"
      AVD_PACKAGE: "system-images;android-34;google_apis;arm64-v8a"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: purchasely/example/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install plugin dependencies
        working-directory: purchasely
        run: npm install

      - name: Install example dependencies
        working-directory: purchasely/example
        run: npm install

      - name: Setup Android platform and plugins
        working-directory: purchasely/example
        run: |
          cordova plugin remove @purchasely/cordova-plugin-purchasely || true
          cordova plugin remove @purchasely/cordova-plugin-purchasely-google || true
          cordova platform remove android || true
          cordova platform add android@latest
          cordova plugin add ../ --link
          cordova plugin add ../../purchasely-google/ --link

      - name: Build debug APK
        working-directory: purchasely/example
        run: cordova build android

      - name: Install system image and create AVD if needed
        run: |
          set -euo pipefail
          sdkmanager --install "$AVD_PACKAGE" || true
          sdkmanager --install "emulator" || true
          sdkmanager --install "platform-tools" || true
          if ! avdmanager list avd | grep -q "$AVD_NAME"; then
            echo "Creating AVD: $AVD_NAME"
            echo "no" | avdmanager create avd \
              --name "$AVD_NAME" \
              --package "$AVD_PACKAGE" \
              --device "pixel_6" \
              --force
          else
            echo "AVD $AVD_NAME already exists — reusing"
          fi

      - name: Start Android emulator
        run: |
          set -euo pipefail
          adb emu kill 2>/dev/null || true
          pkill -9 qemu-system 2>/dev/null || true
          sleep 2

          $ANDROID_HOME/emulator/emulator \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            &

          adb wait-for-device

          boot_completed=""
          attempts=0
          while [ "$boot_completed" != "1" ] && [ $attempts -lt 60 ]; do
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$boot_completed" != "1" ] && sleep 5 && attempts=$((attempts + 1))
          done

          [ "$boot_completed" = "1" ] || (echo "::error::Emulator failed to boot"; exit 1)
          adb shell input keyevent 82

      - name: Disable animations
        run: |
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run E2E suite
        run: PLY_E2E_TIMEOUT=480 bash purchasely/example/integration_test/run_tests_android.sh emulator-5554 --skip-build

      - name: Stop emulator
        if: always()
        run: |
          adb emu kill 2>/dev/null || true
          pkill -9 qemu-system 2>/dev/null || true

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cordova-e2e-logcat
          path: /tmp/e2e_cordova_logcat_*.log
          if-no-files-found: ignore
