name: E2E Android

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - feat/sdk-v6-migration

concurrency:
  group: e2e-android
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: purchasely/example/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install plugin dependencies
        working-directory: purchasely
        run: npm install

      - name: Install example dependencies
        working-directory: purchasely/example
        run: npm install

      - name: Setup Android platform and plugins
        working-directory: purchasely/example
        run: |
          cordova plugin remove @purchasely/cordova-plugin-purchasely || true
          cordova plugin remove @purchasely/cordova-plugin-purchasely-google || true
          cordova platform remove android || true
          cordova platform add android@latest
          cordova plugin add ../ --link
          cordova plugin add ../../purchasely-google/ --link

      - name: Build debug APK
        working-directory: purchasely/example
        run: cordova build android

      - name: Run E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # google_apis provides Google Play Services required by Purchasely billing
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: PLY_E2E_TIMEOUT=480 bash purchasely/example/integration_test/run_tests_android.sh emulator-5554 --skip-build

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cordova-e2e-logcat
          path: |
            /tmp/cordova_e2e_logcat_*.txt
            /tmp/cordova_full_logcat_*.txt
