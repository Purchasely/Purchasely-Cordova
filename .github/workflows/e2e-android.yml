name: E2E Android

# End-to-end JS <-> Android tests against the REAL Purchasely backend, run on a real
# Android emulator via Appium + WebdriverIO. NOT part of the PR-gating ci.yml (they need
# an emulator, real network and the uiautomator2 driver) — they run when a pull request
# opens, and on demand.
#
# Requirements to go green:
#   * the placement PURCHASELY_E2E_PLACEMENT (default ONBOARDING) must exist for the
#     example app id com.purchasely.demo on the backend the example API key points to.
#   * the deterministic `bridge` suite hard-gates; the `dismiss` suite is best-effort.
on:
  pull_request:
    branches: [main]
    # No `synchronize`: a push to an open pull request does not rebuild. It runs once when
    # the PR opens and then only on request — add the `run-ci` label (PR sidebar, or
    # `gh pr edit N --add-label run-ci`).
    types: [opened, reopened, ready_for_review, labeled]
    paths:
      - "purchasely/www/**"
      - "purchasely/src/android/**"
      - "purchasely/example/**"
      - ".github/workflows/e2e-android.yml"
  workflow_dispatch:

# A `labeled` event for any other label must not land in this group: with
# `cancel-in-progress` it would kill a running job, and the replacement run skips the work,
# so the check ends up "skipped" and the requested validation is lost. Dependabot makes that
# concrete — it opens a PR and then applies its own labels to it. Those events get a group
# of their own and cancel nothing.
concurrency:
  group: >-
    e2e-android-${{ github.ref }}-${{
      (github.event.action == 'labeled' && github.event.label.name != 'run-ci')
      && format('label-{0}', github.event.label.name) || 'run' }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Android (real backend)
    runs-on: ubuntu-latest
    # `labeled` fires for every label; only `run-ci` means "build this".
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'run-ci'
    timeout-minutes: 60
    steps:
      # GitHub raises no `labeled` event for a label that is already present, so the label
      # has to go before it can trigger the next run.
      #
      # Only where the token can actually write. A `pull_request` from a fork and a
      # Dependabot PR both run with a read-only token, so this DELETE would 403 and
      # `continue-on-error` would bury it. On those PRs take the label off by hand to ask
      # for another run — one click, not a dead end.
      - name: Consume the run-ci label
        if: >-
          github.event.action == 'labeled' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-ci"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy `tools` package from the SDK repository, so the
          # action's default `tools platform-tools` makes sdkmanager exit 1. platform-tools
          # (adb) is the only half these jobs use.
          packages: platform-tools

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build debug APK
        working-directory: purchasely/example
        run: |
          npm install
          cordova platform remove android || true
          cordova platform add android
          cordova plugin add ../ --link
          cordova plugin add ../../purchasely-google/ --link
          cordova build android

      - name: Install E2E deps (Appium + WebdriverIO)
        working-directory: purchasely/example/e2e
        run: npm install

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6

      - name: Create AVD + snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run E2E suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash purchasely/example/e2e/tools/ci_run_e2e.sh emulator-5554

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-logs
          path: purchasely/example/e2e/ci-logs/
          retention-days: 7
