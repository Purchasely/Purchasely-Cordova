name: E2E iOS (Capacitor)

# The same JS <-> iOS E2E suite as e2e-ios.yml, run against a CAPACITOR host instead of a
# Cordova one. Both hosts serve byte-identical web assets (the Capacitor sample's webDir
# points at purchasely/example/www), so a difference in results is a difference in the
# native host, which is exactly what this leg is for.
#
# Why a second leg: Capacitor's vendored CDVPlugin calls [super init] in
# -initWithWebViewEngine:, so a subclass -init override never runs. cordova-ios has done
# the same up to 6.3.0 and only calls [self init] from 7.0.0 on. purchasely/example pins
# cordova-ios 8.1.1, so the Cordova leg alone can never observe that class of bug.
#
# The fast, deterministic cover for the same failure is the capacitor-ios-tests job in
# ci.yml, which PR-gates. This leg is the end-to-end confirmation and runs nightly.
on:
  pull_request:
    branches: [main]
    paths:
      - "purchasely/www/**"
      - "purchasely/src/ios/**"
      - "purchasely/example/**"
      - "purchasely/example-capacitor/**"
      - ".github/workflows/e2e-ios-capacitor.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: e2e-ios-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios-capacitor:
    name: E2E iOS Capacitor (real backend)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('purchasely/plugin.xml') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      # `npx cap sync` copies the plugin sources out of purchasely/src and regenerates the
      # pods, so the build under test is the working tree, not a published release.
      - name: Build simulator app
        working-directory: purchasely/example-capacitor
        run: |
          npm ci
          npx cap sync ios
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install E2E deps (Appium + WebdriverIO)
        working-directory: purchasely/example/e2e
        run: npm install

      - name: Boot iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16|iPhone 15" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Same specs, same runner, same gating as the Cordova leg. Only the .app under test
      # and its bundle id differ, and those are read from the environment by wdio.ios.conf.js.
      - name: Run E2E suite on simulator
        working-directory: purchasely/example/e2e
        env:
          PURCHASELY_E2E_APP: ${{ github.workspace }}/purchasely/example-capacitor/build/Build/Products/Debug-iphonesimulator/App.app
          PURCHASELY_E2E_BUNDLE_ID: io.purchasely.sample.capacitor
        run: bash ./tools/ci_run_e2e_ios.sh "${{ steps.sim.outputs.udid }}"

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ios-capacitor-logs
          path: purchasely/example/e2e/ci-logs/
          retention-days: 7
