name: E2E iOS

# End-to-end JS <-> iOS tests against the REAL Purchasely backend, run on an iOS
# simulator via Appium (XCUITest) + WebdriverIO. NOT part of the PR-gating ci.yml.
# Runs on demand + nightly. See e2e-android.yml for the placement requirement.
on:
  pull_request:
    branches: [main]
    paths:
      - "purchasely/www/**"
      - "purchasely/src/ios/**"
      - "purchasely/example/**"
      - ".github/workflows/e2e-ios.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    name: E2E iOS (real backend)
    runs-on: macos-15
    timeout-minutes: 60
    # A stable, cacheable home for the WebDriverAgent build. The wdio config's default is
    # os.tmpdir(), which on a macOS runner is a per-boot random path — nothing to cache.
    env:
      PURCHASELY_E2E_WDA_DERIVED: ${{ runner.temp }}/ply-wda-derived
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build simulator app
        working-directory: purchasely/example
        run: |
          npm install
          cordova platform remove ios || true
          cordova platform add ios@8.1.1
          cordova plugin add ../ --link
          cordova build ios --emulator

      - name: Install E2E deps (Appium + WebdriverIO)
        working-directory: purchasely/example/e2e
        run: npm install

      # WebDriverAgent is rebuilt from scratch on every cold runner, and that build was the
      # dominant cost of this job. It depends only on Xcode and on the WDA sources shipped
      # with the xcuitest driver, so it is the same build on every run until either changes.
      - name: WebDriverAgent cache key
        id: wda
        working-directory: purchasely/example/e2e
        run: |
          xc=$(xcodebuild -version | tr '\n' '-' | tr -d ' ')
          wda=$(node -e "
            const path = require('path');
            const dir = path.dirname(require.resolve('appium-xcuitest-driver/package.json'));
            const pkg = require.resolve('appium-webdriveragent/package.json', { paths: [dir] });
            console.log(require(pkg).version);
          ")
          echo "key=wda-${xc}-${wda}" >> "$GITHUB_OUTPUT"

      - name: Restore WebDriverAgent build
        id: wda-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.PURCHASELY_E2E_WDA_DERIVED }}
          key: ${{ steps.wda.outputs.key }}

      - name: Boot iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16|iPhone 15" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run E2E suite on simulator
        working-directory: purchasely/example/e2e
        run: bash ./tools/ci_run_e2e_ios.sh "${{ steps.sim.outputs.udid }}"

      # Save even when the suite fails: the WDA build succeeded either way, and plain
      # actions/cache would drop it on a red run, leaving the next run cold again.
      - name: Save WebDriverAgent build
        if: always() && steps.wda-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.PURCHASELY_E2E_WDA_DERIVED }}
          key: ${{ steps.wda.outputs.key }}

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ios-logs
          path: purchasely/example/e2e/ci-logs/
          retention-days: 7
