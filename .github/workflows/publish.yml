name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish packages
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify versions match release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAIN_VERSION=$(grep -oP '"version": "\K[^"]+' purchasely/package.json)
          GOOGLE_VERSION=$(grep -oP '"version": "\K[^"]+' purchasely-google/package.json)

          if [ "$MAIN_VERSION" != "$TAG" ]; then
            echo "❌ purchasely/package.json version ($MAIN_VERSION) does not match release tag ($TAG)"
            exit 1
          fi

          if [ "$GOOGLE_VERSION" != "$TAG" ]; then
            echo "❌ purchasely-google/package.json version ($GOOGLE_VERSION) does not match release tag ($TAG)"
            exit 1
          fi

          echo "✅ All versions match release tag: $TAG"

      # Prerelease tags (e.g. 6.0.0-rc.1) publish under the `next` dist-tag so they
      # do NOT become npm `latest`; stable tags publish under `latest`.
      - name: Determine npm dist-tag
        id: npmtag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "npm dist-tag: $(grep -oP 'tag=\K.*' "$GITHUB_OUTPUT" | tail -1)"

      - name: Publish @purchasely/cordova-plugin-purchasely
        working-directory: purchasely
        run: npm publish --access public --provenance --tag ${{ steps.npmtag.outputs.tag }}

      - name: Publish @purchasely/cordova-plugin-purchasely-google
        working-directory: purchasely-google
        run: npm publish --access public --provenance --tag ${{ steps.npmtag.outputs.tag }}
